<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcadeMania · Colección de Pinball</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>

    <!-- ── Navbar ──────────────────────────────────────────────────────── -->
    <header class="sticky top-0 z-40 w-full border-b border-[--color-arcade-line] bg-[--color-arcade-base]/90 backdrop-blur-sm">
      <div class="max-w-7xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2.5">
          <!-- Logotipo inline: pelota de pinball en SVG propio -->
          <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="#221a13" stroke="#eab54d" stroke-width="1.5"/>
            <circle cx="16" cy="13" r="5" fill="#eab54d"/>
            <circle cx="14" cy="11" r="1.5" fill="#f7c869"/>
            <path d="M7 22l5-3v4Z" fill="#f3ead9"/>
            <path d="M25 22l-5-3v4Z" fill="#f3ead9"/>
          </svg>
          <span class="font-display text-sm font-black uppercase tracking-widest text-[--color-arcade-cream]">
            Arcade<span class="text-[--color-arcade-gold]">Mania</span>
          </span>
        </div>
        <p class="hidden sm:block text-xs text-[--color-arcade-muted] font-data">
          Colección de Máquinas de Pinball
        </p>
      </div>
    </header>

    <!-- ── Layout principal ────────────────────────────────────────────── -->
    <main class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8">
      <div class="flex flex-col lg:flex-row gap-6 lg:gap-8 items-start">

        <!-- Catálogo (columna izquierda, ancha) -->
        <section class="flex-1 min-w-0">
          <h1 class="sr-only">Catálogo de máquinas de pinball</h1>
          <div id="contenedor-catalogo" aria-live="polite" aria-label="Catálogo de máquinas">
            <!-- Contenido inyectado por PinballBoardView -->
          </div>
        </section>

        <!-- Formulario (columna derecha, fija) -->
        <aside class="w-full lg:w-80 xl:w-96 shrink-0 lg:sticky lg:top-20">
          <div id="contenedor-formulario" aria-label="Formulario de registro">
            <!-- Formulario inyectado por PinballBoardView -->
          </div>
        </aside>

      </div>
    </main>

    <!-- ── Footer ──────────────────────────────────────────────────────── -->
    <footer class="mt-12 border-t border-[--color-arcade-line] py-6">
      <p class="text-center text-[10px] font-data text-[--color-arcade-muted]/60 tracking-wide uppercase">
        ArcadeMania · Bahatech · Hito 2 Frontend
      </p>
    </footer>

  </body>
</html>
